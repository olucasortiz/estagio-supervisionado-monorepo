spring.application.name=lionfitness-backend
spring.config.import=optional:file:.env[.properties]

# ============================================================
# BANCO DE DADOS
# Defina as variáveis de ambiente para não expor credenciais:
#   DB_URL      = jdbc:postgresql://<host>:<port>/postgres?sslmode=require
#   DB_USERNAME = <usuario>
#   DB_PASSWORD = <senha>
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

spring.sql.init.mode=never

server.port=8080

# ============================================================
# JWT — Recomendado definir JWT_SECRET via variável de ambiente
# ============================================================
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# ============================================================
# API NINJAS — defina API_NINJAS_KEY via variável de ambiente
# ============================================================
api.ninjas.key=${API_NINJAS_KEY}
api.ninjas.url=https://api.api-ninjas.com/v1/exercises

# ============================================================
# E-MAIL — defina MAIL_USERNAME e MAIL_PASSWORD via variável de ambiente
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.frontend.url=${APP_FRONTEND_URL:https://lionfitness-sa.duckdns.org,http://localhost:3000}
app.upload.members-dir=uploads/members
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ============================================================
# MERCADO PAGO
# MP_ACCESS_TOKEN  — obrigatório. Defina via variável de ambiente. Sem fallback.
# MP_WEBHOOK_SECRET — obrigatório. Assinatura secreta do webhook de Orders.
# A URL do webhook de Orders é configurada no painel da aplicação Mercado Pago.
# ============================================================
mercado.pago.access-token=${MP_ACCESS_TOKEN}
mercado.pago.public-key=${MP_PUBLIC_KEY:}
mercado.pago.webhook-secret=${MP_WEBHOOK_SECRET}
mercado.pago.sandbox=${MP_SANDBOX:false}

# ============================================================
# JACKSON — Serialização de datas como strings ISO 8601
# Sem isso, LocalDate é serializado como array [YYYY, MM, DD]
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

