spring.application.name=lionfitness-backend
spring.config.import=optional:file:.env[.properties]

# ============================================================
# BANCO DE DADOS
# Defina as variáveis de ambiente para não expor credenciais:
#   DB_URL      = jdbc:postgresql://<host>:<port>/postgres?sslmode=require
#   DB_USERNAME = <usuario>
#   DB_PASSWORD = <senha>
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.bvcowkkanyaefgbezvtu}
spring.datasource.password=${DB_PASSWORD:ttjkDdrULJhjkn2B}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

spring.sql.init.mode=never

server.port=8080

# ============================================================
# JWT — Recomendado definir JWT_SECRET via variável de ambiente
# ============================================================
security.jwt.secret=${JWT_SECRET:lionfitness-development-secret-change-me}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# ============================================================
# API NINJAS — defina API_NINJAS_KEY via variável de ambiente
# ============================================================
api.ninjas.key=${API_NINJAS_KEY:DfkMVb2MLB5yXJlJtBAcPMLl0o9hmkpXNgvMeJnX}
api.ninjas.url=https://api.api-ninjas.com/v1/exercises

# ============================================================
# E-MAIL — defina MAIL_USERNAME e MAIL_PASSWORD via variável de ambiente
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.frontend.url=http://localhost:3000
app.upload.members-dir=uploads/members
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
